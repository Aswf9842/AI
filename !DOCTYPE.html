    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 全局逻辑属性支持 RTL */
        :root {
            --grad-start: #FFB347;
            --grad-end: #FF6B6B;
            --card-bg: rgba(255, 255, 255, 0.96);
            --text-dark: #2D3E50;
            --text-soft: #5A6E7F;
            --accent: #FF8C42;
            --shadow-sm: 0 10px 25px -5px rgba(0,0,0,0.1);
        }

        body {
            background: linear-gradient(135deg, #FFE5B4 0%, #FFD1D1 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, 'Poppins', sans-serif;
            padding: 20px;
            transition: background 0.3s;
        }

        /* RTL 适配 */
        [dir="rtl"] {
            text-align: right;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px 0;
        }

        /* 主卡片 */
        .card {
            background: var(--card-bg);
            border-radius: 2.5rem;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            backdrop-filter: blur(2px);
            transition: transform 0.2s ease;
        }

        .card-header {
            background: linear-gradient(120deg, #FF8C42, #FF5E7E);
            padding: 2rem 2rem 1.5rem;
            color: white;
            text-align: center;
            position: relative;
        }

        .lang-switch {
            position: absolute;
            top: 20px;
            right: 25px;
            display: flex;
            gap: 8px;
            background: rgba(255,255,255,0.2);
            padding: 5px 12px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }
        [dir="rtl"] .lang-switch {
            right: auto;
            left: 25px;
        }
        .lang-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 30px;
            transition: 0.2s;
        }
        .lang-btn.active {
            background: white;
            color: #FF5E7E;
        }

        .card-header h1 {
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .badge {
            background: rgba(255,255,255,0.25);
            padding: 5px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .sub {
            opacity: 0.9;
            margin-top: 12px;
            font-size: 0.9rem;
        }

        /* 主体 */
        .card-body {
            padding: 2rem;
        }

        .input-group {
            margin-bottom: 1.8rem;
        }

        label {
            font-weight: 700;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        textarea {
            width: 100%;
            padding: 1rem 1.2rem;
            font-size: 1rem;
            border: 2px solid #FFE0C0;
            border-radius: 1.5rem;
            font-family: inherit;
            resize: vertical;
            transition: all 0.2s;
            background: #FFFBF5;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(255, 140, 66, 0.2);
        }

        .char-counter {
            text-align: right;
            margin-top: 6px;
            font-size: 0.75rem;
            color: var(--text-soft);
        }
        [dir="rtl"] .char-counter {
            text-align: left;
        }

        .style-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
        }

        .style-btn {
            background: #F5EDE3;
            border: none;
            padding: 8px 20px;
            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #5A4D3E;
        }

        .style-btn.active {
            background: var(--accent);
            color: white;
            transform: scale(1.02);
            box-shadow: 0 6px 12px rgba(255,140,66,0.3);
        }

        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
        }

        .example-chip {
            background: #FFF0E0;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .example-chip:hover {
            background: #FFE0C0;
            transform: translateY(-2px);
        }

        button.primary {
            width: 100%;
            background: linear-gradient(135deg, var(--grad-start), var(--grad-end));
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        button.primary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px -10px rgba(255, 100, 100, 0.5);
        }

        button.primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-area {
            margin-top: 32px;
            background: #FFF9F0;
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 1px solid #FFE5C2;
            transition: all 0.2s;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .copy-btn {
            background: #EDE3D4;
            border: none;
            padding: 6px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .explanation-text {
            line-height: 1.7;
            font-size: 1rem;
            color: #2D3E50;
            white-space: pre-wrap;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 30px;
            color: #FF8C42;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #FFD5B5;
            border-top-color: #FF8C42;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error-message {
            background: #FFECEC;
            border-left: 5px solid #FF6B6B;
            padding: 14px;
            border-radius: 20px;
            color: #B33;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: rgba(0,0,0,0.5);
            font-size: 0.75rem;
        }

        /* 彩蛋飘落动画 */
        .emoji-rain {
            position: fixed;
            top: -20px;
            font-size: 28px;
            pointer-events: none;
            animation: fall linear forwards;
            z-index: 999;
        }
        @keyframes fall {
            to { transform: translateY(100vh); opacity: 0; }
        }

        /* 月光特效 */
        .moonlight::after {
            content: "🌙✨";
            position: absolute;
            bottom: 10px;
            right: 20px;
            font-size: 3rem;
            opacity: 0.3;
            pointer-events: none;
        }
        .card-header { position: relative; overflow: hidden; }
        @media (max-width: 640px) {
            .card-body { padding: 1.5rem; }
            .card-header h1 { font-size: 1.7rem; }
        }
    </style>
</head>

    }

    function getRandomCheer() {
        const arr = locales[currentLang].cheerMsgs;
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function updateUILang() {
        const t = locales[currentLang];
        document.getElementById('titleText').innerText = t.title;
        document.getElementById('badgeText').innerText = t.badge;
        document.getElementById('subText').innerText = t.sub;
        document.getElementById('inputLabel').innerHTML = t.inputLabel;
        document.getElementById('knowledgeInput').placeholder = t.placeholder;
        document.getElementById('btnText').innerText = t.btnDefault;
        document.getElementById('resultTitle').innerText = t.resultTitle;
        document.getElementById('copyBtn').innerHTML = t.copy;
        document.getElementById('footerNote').innerText = t.footer;
        document.getElementById('styleSimple').innerText = t.styleSimple;
        document.getElementById('styleMeta').innerText = t.styleMeta;
        document.getElementById('styleStory').innerText = t.styleStory;
        document.getElementById('StyleHumor').innerText = t.styleHumor;
        document.getElementById('styleAnalogy').innerText = t.styleAnalogy;
        // 示例区域重新填充
        const exContainer = document.getElementById('examplesArea');
        exContainer.innerHTML = '';
        t.examples.forEach(ex => {
            const chip = document.createElement('span');
            chip.className = 'example-chip';
            chip.innerText = ex.text;
            chip.setAttribute('data-value', ex.value);
            chip.addEventListener('click', () => {
                document.getElementById('knowledgeInput').value = ex.value;
                document.getElementById('knowledgeInput').focus();
            });
            exContainer.appendChild(chip);
        });
        // 字符计数占位刷新
        const inputVal = document.getElementById('knowledgeInput').value;
        updateCharCounter(inputVal.length);
        // RTL
        const htmlEl = document.documentElement;
        if (currentLang === 'ar') {
            htmlEl.setAttribute('dir', 'rtl');
            isRTL = true;
        } else {
            htmlEl.setAttribute('dir', 'ltr');
            isRTL = false;
        }
    }

    function updateCharCounter(len) {
        const t = locales[currentLang];
        const counterDiv = document.getElementById('charCounter');
        if (len === 0) counterDiv.innerHTML = t.charPlaceholder || "✨ 等你好久了";
        else if (len < 20) counterDiv.innerHTML = `📝 ${len} 字 · 嗯，有内味儿了 🤔`;
        else if (len < 100) counterDiv.innerHTML = `🔥 ${len} 字 · 好家伙，这知识点有点东西！ 💪`;
        else counterDiv.innerHTML = `🚀 ${len} 字 · 大佬请赐教！ ⚡`;
    }

    // 彩虹屁 & 彩蛋系统
    let eggCount = 0;
    function triggerEasterEgg(name) {
        const eggMsg = document.getElementById('extraCheer');
        if (!eggMsg) return;
        const messages = { "42": "👽 答案是42，但和你的知识点无关喔。", "cat": "🐱 喵~ 随机名词猫化成功！", "复读机": "🦜 你是复读机吗？嘎嘎", "moon": "🌙 深夜学习小星星陪着你", "weekend": "🎉 周末倒计时！学习能量+100" };
        if (messages[name]) {
            eggMsg.innerHTML = `🥚 彩蛋！ ${messages[name]}`;
            setTimeout(() => { if(eggMsg) eggMsg.innerHTML = ""; }, 3000);
        }
        // 飘落 emoji 雨
        if (name === "rain") {
            for(let i=0;i<30;i++) {
                const emoji = ['💩','🥚','✨','🐱','🍑'][Math.floor(Math.random()*5)];
                const rainDiv = document.createElement('div');
                rainDiv.className = 'emoji-rain';
                rainDiv.innerText = emoji;
                rainDiv.style.left = Math.random() * 100 + '%';
                rainDiv.style.animationDuration = Math.random() * 2 + 1.5 + 's';
                document.body.appendChild(rainDiv);
                setTimeout(()=> rainDiv.remove(), 3000);
            }
        }
    }

    // 转换模拟 (演示)
    async function explainKnowledge() {
        const inputElem = document.getElementById('knowledgeInput');
        const knowledge = inputElem.value.trim();
        if (!knowledge) {
            document.getElementById('resultArea').style.display = 'block';
            document.getElementById('explanationContent').innerHTML = `<div class="error-message">⚠️ ${locales[currentLang].errorEmpty}</div>`;
            return;
        }
        setLoading(true);
        setTimeout(() => {
            try {
                let explanation = getMockExplanation(knowledge, currentStyle);
                // 彩蛋检测: 输入 "42"
                if (knowledge.includes("42") || knowledge.toLowerCase().includes("forty two")) triggerEasterEgg("42");
                if (knowledge.toLowerCase().includes("cat") || knowledge.includes("🐱")) triggerEasterEgg("cat");
                // 深夜彩蛋: 0-5点
                const hour = new Date().getHours();
                if (hour >= 0 && hour < 5) triggerEasterEgg("moon");
                const day = new Date().getDay();
                if (day === 5 && hour > 14) triggerEasterEgg("weekend");
                // 随机极稀有彩蛋 1%
                if (Math.random() < 0.03) triggerEasterEgg("rain");
                const finalText = explanation + "\n\n" + getRandomCheer();
                document.getElementById('explanationContent').innerHTML = finalText.replace(/\n/g, '<br>');
                document.getElementById('resultArea').style.display = 'block';
                document.getElementById('extraCheer').innerHTML = '';
            } catch(e) {
                document.getElementById('explanationContent').innerHTML = `<div class="error-message">${locales[currentLang].errorNetwork}</div>`;
            } finally {
                setLoading(false);
            }
        }, 900);
    }

    function setLoading(loading) {
        isLoading = loading;
        const btn = document.getElementById('convertBtn');
        const btnSpan = document.getElementById('btnText');
        if (loading) {
            btn.disabled = true;
            btnSpan.innerText = locales[currentLang].btnLoad;
        } else {
            btn.disabled = false;
            btnSpan.innerText = locales[currentLang].btnDefault;
        }
    }

    // 复制
    document.getElementById('copyBtn')?.addEventListener('click', async () => {
        const textElem = document.getElementById('explanationContent');
        const text = textElem.innerText;
        if (!text) return;
        await navigator.clipboard.writeText(text);
        const copyBtn = document.getElementById('copyBtn');
        const original = copyBtn.innerHTML;
        copyBtn.innerHTML = locales[currentLang].copied;
        setTimeout(() => copyBtn.innerHTML = original, 1500);
    });

    // 监听输入框计数
    const inputArea = document.getElementById('knowledgeInput');
    inputArea.addEventListener('input', (e) => updateCharCounter(e.target.value.length));
    // 风格切换
    document.querySelectorAll('.style-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentStyle = btn.getAttribute('data-style');
        });
    });
    // 语言切换
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentLang = btn.getAttribute('data-lang');
            updateUILang();
        });
    });
    // 转换按钮彩蛋：点击3次相同内容触发
    let sameContentCount = 0;
    let lastContent = "";
    document.getElementById('convertBtn').addEventListener('click', () => {
        const val = inputArea.value;
        if (val === lastContent && val !== "") sameContentCount++;
        else { sameContentCount = 0; lastContent = val; }
        if (sameContentCount >= 3) triggerEasterEgg("复读机");
        explainKnowledge();
    });
    // 按钮 hover 彩蛋动态文案
    const convertButton = document.getElementById('convertBtn');
    convertButton.addEventListener('mouseenter', () => {
        if (!isLoading && document.getElementById('btnText').innerText !== locales[currentLang].btnLoad)
            document.getElementById('btnText').innerText = locales[currentLang].btnHover;
    });
    convertButton.addEventListener('mouseleave', () => {
        if (!isLoading) document.getElementById('btnText').innerText = locales[currentLang].btnDefault;
    });

    updateUILang();
    updateCharCounter(0);
</script>
</body>
</html>
