        analogy: "就像你在冰面上推一个箱子——推一下它滑老远，因为摩擦小，阻力不够让它停下来。也像你打台球，白球撞击别的球之后自己还在滚，直到撞到桌边。也像你甩完披萨面团，它还在空中转——没人动它之前它会一直转下去。\n\n✨ 一句话总结：冰面推箱子、打台球、甩披萨，全是惯性在干活。"

        humorous: "过拟合就是AI版的'换个马甲就不认识你了'。你给它看了100张猫的照片，它学会了——但全是橘猫。结果你拿一只黑猫过去，它说：这不是猫，因为没有橘色。AI种族歧视实锤。\n\n✨ 一句话总结：橘猫才是猫，黑猫？不认识。",
        analogy: "就像人脸识别系统只记住了同桌脸上的那颗痘印——换个没痘的人它就不认识了。也像你妈只认你穿的那件校服，你换了件卫衣她就不叫你吃饭了。也像你的手机Face ID只认你素颜——画个眉毛就解锁不了。\n\n✨ 一句话总结：痘印识别器、认校服的妈、素颜Face ID，全部过拟合。"
    },
    "解释一下'机会成本'": {

        analogy: "十字路口，你选了左边，右边那条路尽头埋着一箱宝藏——那箱宝藏就是机会成本。也像Tinder你左滑了一个人，永远不知道ta是不是你的真爱（但大概率不是）。也像你买了奶茶就放弃了咖啡的提神效果——每一个消费都是一次选择屠杀。\n\n✨ 一句话总结：选岔路、左滑人、买奶茶，全是机会成本的现实版。"

        metaphor: "你朋友搬家了，你记不住他新地址，但你的通话记录里还有他的备注名'二狗'，点一下就能播出去。DNS就是这个备注系统——把人类能记住的域名（baidu.com）翻译成电脑能读懂的数字IP（220.181.38.148）。\n\n✨ 一句话总结：把baidu.com翻译成220.181.38.148。",
        story: "互联网刚出来的时候，上网得记住一串数字才能访问网站，比如204.79.197.200是Bing。正常人哪记得住？后来有个聪明人说：咱们搞个电话本吧，你输bing.com，系统自动帮你查号码。于是DNS诞生了，上网的门槛从'背号码'降到了'打字'。\n\n✨ 一句话总结：以前上网记IP，现在上网打字，全因DNS。",
        humorous: "DNS就是互联网的114查号台。你在地址栏输入'我要吃火锅.com'——DNS查了半天：没有这个域名。对，查号台就是这样，不是啥都知道的。DNS还会偶尔出bug让你上不了网，像你打查号台占线一样让人暴躁。\n\n✨ 一句话总结：比114靠谱，但也偶尔摆烂。",
        analogy: "就像手机通讯录——你存的联系人背后都是电话号码，但你从来不拨号，只点名字。DNS就是做这个翻译工作的。也像你的快递柜取件码——你记'3号柜'而不是'3号柜的GPS坐标'。也像你家楼下的门牌号系统——你说'302室'，不需要给快递员发经纬度。\n\n✨ 一句话总结：三件事——通讯录、快递柜、门牌号，全是DNS这回事。"
    }
};

// 知识库（兜底匹配，给没有精确对应的关键词提供解释）
const knowledgeBase = {
    "量子纠缠": "想象一下你和你双胞胎兄弟姐妹之间的心灵感应——不管隔多远，你摔了一跤ta膝盖也会疼。量子纠缠就是这么诡异：两个粒子一旦配对，不管相隔多少光年，测了其中一个的状态，另一个就瞬间确定。爱因斯坦管这叫'鬼魅般的超距作用'，他觉得这不科学，但这偏偏是真的。两个粒子之间的感情，比异地恋还坚固。\n\n✨ 一句话总结：两个粒子的心灵感应，连爱因斯坦都服了。",
    "黑洞": "像一个超级无敌吸尘器——不，比吸尘器猛多了。任何东西靠近它，连光都跑不掉，全被吸进去。你站在黑洞旁边喊一声'救命'，声音出不来，光也出不来。黑洞质量大到把周围的空间都压弯了，像一个巨大的宇宙下水道，一切掉进去就再也出不来了。\n\n✨ 一句话总结：宇宙级吸尘器，光都逃不掉。",
    "熵": "你的房间不收拾只会越来越乱对吧？永远不会自己变整齐。这就是熵——宇宙也在走向越来越混乱。你收拾房间是在'减熵'，但那是费了很大劲才做到的。自然界自发的过程全都是越来越乱。你的桌子、你的衣柜、你的人生——都在无情地熵增。\n\n✨ 一句话总结：房间不收拾只会更乱，宇宙也是。",

    "贝叶斯定理": "你看到邻居拿着伞出门，于是你心里默默把'今天下雨'的概率从30%上调到了80%。贝叶斯定理说的就是这事儿——你手里有了新证据（邻居拿伞）之后，怎么科学地更新你的旧判断（下雨概率）。不是瞎猜，是用数学告诉你'有多大把握该改了'。\n\n✨ 一句话总结：看到邻居拿伞，你觉得更可能下雨了。",
    "幸存者偏差": "你只看到活下来的人有多风光，没看到死了的人是什么下场。比如问成功人士'你是怎么成功的'——你问的都是活下来的，失败的那些人你根本采访不到。你看到的'成功秘诀'可能只是幸存者运气。就像你只看那些彩票中奖的人，忽略了99.99%没中的人正在吃土。\n\n✨ 一句话总结：只问活下来的，不问死去的。",
    "边际效用递减": "饿了一天，第一个汉堡幸福到飞起，吃相都不顾了。第二个，嗯还行。第三个，有点撑。第四个，求你别再给我了。第五个，看到就想吐。每多吃一个，快乐增量越来越少——这就是边际效用递减。谈恋爱也是，第一次约会心动到爆，第一百次约会：你去吧我打游戏。\n\n✨ 一句话总结：第一个汉堡最香，第五个想吐。",
    "机会成本": "周六晚上你选了去聚会，没去上的那节技能课就是你的机会成本。不是你'亏了'，而是你选择A的时候，自动放弃了B能带给你的最大好处。选什么都有代价，承认这一点会让你的人生更容易做决定——因为你知道，完美选项不存在。\n\n✨ 一句话总结：选聚会还是上课？放弃的那个就是成本。",
    "过拟合": "你把一套卷子的答案背烂了，每题怎么写都记得。但考试换了数字、换了场景，直接零分。因为你在'背'不是在'学'。机器学习里的过拟合就是这个意思——模型把训练数据刻进DNA了，新数据一来就翻车。\n\n✨ 一句话总结：背答案满分，换卷子零分。",
    "区块链": "一个不会说谎的公共账本。每个交易记录都被打包进一个'区块'，一个接一个链接起来，存遍全球无数台电脑。想改其中一条记录？得同时改服务器里所有人的副本。比改全班同学的作业还难。买菜的、转账的、签合同的——以后很多事不用找第三方担保了，区块链自己就是担保。\n\n✨ 一句话总结：全球共享的防伪账本，机器替人担保。"
};

function getExplanation(knowledge, style) {
    // 尝试精确匹配
    for (let key in mockExps) {
        if (knowledge.includes(key) || key.includes(knowledge)) {
            return mockExps[key][style] || mockExps[key]['simple'];
        }
    }
    // 尝试知识库匹配
    for (let key in knowledgeBase) {
        if (knowledge.includes(key) || key.includes(knowledge)) {
            return knowledgeBase[key];
        }
    }
    // 通用回退
    return `✨ 关于"${knowledge}"的人话版：\n\n这个知识点乍一看挺唬人的，但拆开看也没那么可怕。咱们拿生活里的事来打个比方：就好比你第一次学骑自行车的时候觉得好难啊又要平衡又要踩踏板又要看路，但等你学会了就觉得——哦，原来就这？\n\n你问的这个东西，本质上也是在讲一个类似的模式。别看术语吓人，背后的道理往往朴实得很。试着用自己的话重说一遍，你就发现你已经懂了～`;
}

function getRandomCheer() {
    const arr = locales[currentLang].cheerMsgs;
    return arr[Math.floor(Math.random() * arr.length)];
}

function updateUILang() {
    const t = locales[currentLang];
    document.getElementById('titleText').innerText = t.title;
    document.getElementById('badgeText').innerText = t.badge;
    document.getElementById('subText').innerText = t.sub;
    document.getElementById('inputLabel').innerHTML = t.inputLabel;
    document.getElementById('knowledgeInput').placeholder = t.placeholder;
    document.getElementById('btnText').innerText = t.btnDefault;
    document.getElementById('resultTitle').innerText = t.resultTitle;
    document.getElementById('copyBtn').innerHTML = t.copy;
    document.getElementById('footerNote').innerText = t.footer;
    document.getElementById('styleSimple').innerText = t.styleSimple;
    document.getElementById('styleMeta').innerText = t.styleMeta;
    document.getElementById('styleStory').innerText = t.styleStory;
    document.getElementById('styleHumor').innerText = t.styleHumor;
    document.getElementById('styleAnalogy').innerText = t.styleAnalogy;
    // 示例按钮
    const exContainer = document.getElementById('examplesArea');
    exContainer.innerHTML = '';
    t.examples.forEach(ex => {
        const chip = document.createElement('span');
        chip.className = 'example-chip';
        chip.innerText = ex.text;
        chip.addEventListener('click', () => {
            document.getElementById('knowledgeInput').value = ex.value;
            document.getElementById('knowledgeInput').focus();
        });
        exContainer.appendChild(chip);
    });
    // RTL
    const htmlEl = document.documentElement;
    htmlEl.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
    updateCharCounter(document.getElementById('knowledgeInput').value.length);
}

function updateCharCounter(len) {
    const t = locales[currentLang];
    const counterDiv = document.getElementById('charCounter');
    if (len === 0) counterDiv.innerHTML = t.charPlaceholder;
    else if (len < 20) counterDiv.innerHTML = `📝 ${len} 字 · 嗯，有内味儿了 🤔`;
    else if (len < 100) counterDiv.innerHTML = `🔥 ${len} 字 · 好家伙，这知识点有点东西！ 💪`;
    else counterDiv.innerHTML = `🚀 ${len} 字 · 大佬请赐教！ ⚡`;
}

// ====== 彩蛋系统 ======
let eggCount = 0;
let sameCount = 0;
let lastContent = "";

function triggerEgg(name) {
    const egg = document.getElementById('extraCheer');
    if (!egg) return;
    const msgs = {
        "42": "👽 答案是42，但和你的知识点无关喔。",
        "cat": "🐱 喵~ 随机名词猫化成功！",
        "repeater": "🦜 你是复读机吗？嘎嘎",
        "moon": "🌙 深夜学习小星星陪着你，但该睡了",
        "weekend": "🎉 周末倒计时！学习能量+100"
    };
    if (msgs[name]) {
        egg.innerHTML = `🥚 彩蛋！ ${msgs[name]}`;
        setTimeout(() => { if(egg) egg.innerHTML = ""; }, 3000);
    }
    if (name === "rain") {
        for(let i=0;i<30;i++) {
            const emoji = ['💩','🥚','✨','🐱','🍑'][Math.floor(Math.random()*5)];
            const d = document.createElement('div');
            d.className = 'emoji-rain';
            d.innerText = emoji;
            d.style.left = Math.random() * 100 + '%';
            d.style.animationDuration = (Math.random()*2+1.5) + 's';
            document.body.appendChild(d);
            setTimeout(()=> d.remove(), 3000);
        }
    }
}

async function explain() {
    const input = document.getElementById('knowledgeInput');
    const text = input.value.trim();
    if (!text) {
        document.getElementById('resultArea').style.display = 'block';
        document.getElementById('explanationContent').innerHTML = `<div class="error-message">⚠️ ${locales[currentLang].errorEmpty}</div>`;
        document.getElementById('extraCheer').innerHTML = '';
        return;
    }
    // 彩蛋检测
    if (text.includes("42") || text.toLowerCase().includes("forty two")) triggerEgg("42");
    if (text.toLowerCase().includes("cat") || text.includes("🐱")) triggerEgg("cat");
    const h = new Date().getHours();
    if (h >= 0 && h < 5) triggerEgg("moon");
    const d = new Date().getDay();
    if (d === 5 && h > 14) triggerEgg("weekend");
    if (Math.random() < 0.03) setTimeout(() => triggerEgg("rain"), 100);

    setLoading(true);
    setTimeout(() => {
        try {
            const exp = getExplanation(text, currentStyle);
            const final = exp + "\n\n" + getRandomCheer();
            document.getElementById('explanationContent').innerHTML = final.replace(/\n/g, '<br>');
            document.getElementById('resultArea').style.display = 'block';
            document.getElementById('extraCheer').innerHTML = '';
        } catch(e) {
            document.getElementById('explanationContent').innerHTML = `<div class="error-message">${locales[currentLang].errorNetwork}</div>`;
        } finally {
            setLoading(false);
        }
    }, 700);
}

function setLoading(v) {
    isLoading = v;
    const btn = document.getElementById('convertBtn');
    const span = document.getElementById('btnText');
    btn.disabled = v;
    span.innerText = v ? locales[currentLang].btnLoad : locales[currentLang].btnDefault;
}

// ====== Event Listeners ======
document.getElementById('knowledgeInput').addEventListener('input', (e) => updateCharCounter(e.target.value.length));

document.querySelectorAll('.style-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentStyle = btn.getAttribute('data-style');
    });
});

document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentLang = btn.getAttribute('data-lang');
        updateUILang();
    });
});

document.getElementById('convertBtn').addEventListener('click', () => {
    const val = document.getElementById('knowledgeInput').value;
    if (val === lastContent && val !== "") sameCount++;
    else { sameCount = 0; lastContent = val; }
    if (sameCount >= 3) triggerEgg("repeater");
    explain();
});

const convBtn = document.getElementById('convertBtn');
convBtn.addEventListener('mouseenter', () => {
    if (!isLoading) document.getElementById('btnText').innerText = locales[currentLang].btnHover;
});
convBtn.addEventListener('mouseleave', () => {
    if (!isLoading) document.getElementById('btnText').innerText = locales[currentLang].btnDefault;
});

document.getElementById('copyBtn').addEventListener('click', async () => {
    const text = document.getElementById('explanationContent').innerText;
    if (!text) return;
    try { await navigator.clipboard.writeText(text); } catch {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy');
        document.body.removeChild(ta);
    }
    const cb = document.getElementById('copyBtn');
    const orig = cb.innerHTML;
    cb.innerHTML = locales[currentLang].copied;
    setTimeout(() => cb.innerHTML = orig, 1500);
});

// ====== Init ======
updateUILang();
updateCharCounter(0);
</script>
